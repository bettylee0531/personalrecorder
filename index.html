  /* ----- dday ----- */
  const DDAY_KEY = 'records-dday';
  const listWrap = document.getElementById('ddayList');
  const addForm = document.getElementById('ddayAdd');
  const yearlyBtn = document.getElementById('ddayYearly');
  const fromOneBtn = document.getElementById('ddayFromOne');
  let dday = emptyDday();

  function emptyDday() { return { v: 1, items: [] }; }
  function validItem(it) {
    return it && typeof it.id === 'string' && typeof it.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(it.date);
  }
  function normalizeItem(it) {
    if (!validItem(it)) return null;
    return {
      id: it.id,
      title: it.title,
      date: it.date,
      yearly: !!it.yearly,
      fromOne: !!it.fromOne,
      pinned: !!it.pinned
    };
  }
  function hydrateDday(data) {
    const next = emptyDday();
    if (!data || typeof data !== 'object') return next;
    if (Number.isFinite(data.v)) next.v = data.v;
    next.items = Array.isArray(data.items) ? data.items.map(normalizeItem).filter(Boolean) : [];
    return next;
  }
  function loadDday() {
    try {
      const raw = localStorage.getItem(DDAY_KEY);
      dday = raw ? hydrateDday(JSON.parse(raw)) : emptyDday();
    } catch (e) { dday = emptyDday(); }
  }
  function saveDday(opts) {
    try { localStorage.setItem(DDAY_KEY, JSON.stringify(dday)); }
    catch (e) { alert('저장 공간이 부족해요.'); }
    if ((!opts || !opts.localOnly) && window.RecordsCloud) window.RecordsCloud.onDdaySave(dday);
  }
  function applyCloudDday(data) {
    dday = hydrateDday(data);
    saveDday({ localOnly: true });
    renderDday();
  }

  function compute(item, today) {
    today = today || U.todayISO();
    let target = item.date;
    let group, n, label, sort;
    if (item.yearly) {
      target = U.nextYearlyISO(item.date, today);
    }
    if (!item.yearly && item.fromOne && item.date <= today) {
      n = U.daysBetween(item.date, today) + 1;
      group = 'past';
      label = 'D+' + n;
      sort = n;
      return { target: item.date, group, n, label, sort };
    }
    if (target === today) {
      return { target, group: 'up', n: 0, label: 'D-Day', sort: 0 };
    }
    if (target > today) {
      n = U.daysBetween(today, target);
      return { target, group: 'up', n, label: 'D-' + n, sort: n };
    }
    n = U.daysBetween(target, today);
    return { target, group: 'past', n, label: 'D+' + n, sort: n };
  }

  function renderDday() {
    const today = U.todayISO();
    const rows = dday.items.map(it => ({ it, c: compute(it, today) }));
    const up = rows.filter(r => r.c.group === 'up');
    const past = rows.filter(r => r.c.group === 'past');
    const pinned = up.filter(r => r.it.pinned);
    const rest = up.filter(r => !r.it.pinned).sort((a, b) => a.c.sort - b.c.sort || a.it.title.localeCompare(b.it.title, 'ko'));
    past.sort((a, b) => a.c.sort - b.c.sort || a.it.title.localeCompare(b.it.title, 'ko'));
    const upcoming = pinned.concat(rest);

    function card(r) {
      const chips = (r.it.pinned ? '<span class="pin-mark">고정</span>' : '') +
        (r.it.yearly ? '<span class="chip">매년</span>' : '') +
        (r.it.fromOne ? '<span class="chip">1일부터 세기</span>' : '');
      const cls = 'dday-card' + (r.it.pinned && r.c.group === 'up' ? ' pinned' : '') + (r.c.group === 'past' ? ' past' : '');
      return '<div class="' + cls + '" data-id="' + U.escapeHtml(r.it.id) + '">' +
        '<div class="dday-body"><div class="dday-title">' + U.escapeHtml(r.it.title) + ' ' + chips + '</div>' +
        '<div class="dday-date">' + U.fmtDot(r.c.target) + ' ' + U.dowName(r.c.target) + '</div></div>' +
        '<div class="dday-count">' + r.c.label + '</div></div>';
    }

    if (!rows.length) {
      listWrap.innerHTML = '<p class="empty-msg">디데이를 추가해 보세요.</p>';
      return;
    }
    let html = '<div class="dday-list">' + upcoming.map(card).join('') + '</div>';
    if (past.length) {
      html += '<p class="sec-label">지난 디데이</p><div class="dday-list">' + past.map(card).join('') + '</div>';
    }
    listWrap.innerHTML = html;
  }

  function setOpt(btn, on) {
    btn.dataset.on = on ? '1' : '0';
    btn.classList.toggle('on', !!on);
  }
  yearlyBtn.addEventListener('click', () => setOpt(yearlyBtn, yearlyBtn.dataset.on !== '1'));
  fromOneBtn.addEventListener('click', () => setOpt(fromOneBtn, fromOneBtn.dataset.on !== '1'));

  addForm.addEventListener('submit', e => {
    e.preventDefault();
    const title = addForm.title.value.trim();
    const date = addForm.date.value;
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    dday.items.push(normalizeItem({
      id: U.uid('d'),
      title, date,
      yearly: yearlyBtn.dataset.on === '1',
      fromOne: fromOneBtn.dataset.on === '1',
      pinned: false
    }));
    saveDday();
    addForm.title.value = '';
    addForm.date.value = '';
    setOpt(yearlyBtn, false);
    setOpt(fromOneBtn, false);
    renderDday();
    addForm.title.focus();
  });

  listWrap.addEventListener('click', e => {
    const card = e.target.closest('.dday-card[data-id]');
    if (!card) return;
    const it = dday.items.find(x => x.id === card.dataset.id);
    if (!it) return;
    window.RecordsModal.open({
      title: '디데이 수정',
      body:
        '<input type="text" name="title" value="' + U.escapeHtml(it.title) + '" placeholder="제목">' +
        '<input type="date" name="date" value="' + U.escapeHtml(it.date) + '">' +
        '<label class="modal-check"><input type="checkbox" name="yearly"' + (it.yearly ? ' checked' : '') + '> 매년 반복</label>' +
        '<label class="modal-check"><input type="checkbox" name="fromOne"' + (it.fromOne ? ' checked' : '') + '> 1일부터 세기</label>' +
        '<label class="modal-check"><input type="checkbox" name="pinned"' + (it.pinned ? ' checked' : '') + '> 맨 위에 고정</label>',
      actions: [
        { act: 'ok', label: '저장' },
        { act: 'delete', label: '삭제', className: 'danger' },
        { act: 'cancel', label: '취소', className: 'ghost' }
      ]
    }).then(res => {
      if (res.act === 'delete') {
        if (!confirm('이 디데이를 지울까요?')) return;
        dday.items = dday.items.filter(x => x.id !== it.id);
        saveDday();
        renderDday();
        return;
      }
      if (res.act !== 'ok') return;
      const title = (res.form.title || '').trim();
      const date = res.form.date;
      if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      it.title = title;
      it.date = date;
      it.yearly = !!res.form.yearly;
      it.fromOne = !!res.form.fromOne;
      it.pinned = !!res.form.pinned;
      saveDday();
      renderDday();
    });
  });

  document.addEventListener('records-panel', ev => {
    if (ev.detail === 'dday') renderDday();
  });

  loadDday();
  window.RecordsDday = {
    getState: () => dday,
    applyCloud: applyCloudDday,
    compute,
    render: renderDday,
    empty: emptyDday,
    hydrate: hydrateDday
  };
})();

</script>

function $(id) { return document.getElementById(id); }

function toast(msg, ms) {

  el.textContent = msg;
  el.classList.add("show");

  toastTimer = setTimeout(() => el.classList.remove("show"), ms || 2800);
}

function friendlyError(err) {
  const code = (err && err.code) || "";
  const map = {
    "auth/unauthorized-domain": "이 주소가 Firebase 승인된 도메인에 등록되지 않았어요.",
    "auth/popup-blocked": "로그인 팝업이 차단되었어요.",

    "auth/cancelled-popup-request": "로그인 창이 이미 열려 있어요.",
    "auth/network-request-failed": "네트워크 연결을 확인해 주세요.",
    "auth/internal-error": "로그인 중 오류가 났어요. 잠시 후 다시 시도해 주세요.",
    "auth/operation-not-allowed": "Google 로그인이 Firebase에서 아직 켜져 있지 않아요.",
    "auth/account-exists-with-different-credential": "같은 이메일로 이미 다른 로그인 방법이 연결되어 있어요.",
    "permission-denied": "저장 권한이 없어요. 로그인 상태를 확인해 주세요.",
    "firestore/permission-denied": "저장 권한이 없어요. 로그인 상태를 확인해 주세요.",
    "unavailable": "네트워크를 확인해 주세요. 연결되면 자동으로 동기화돼요."
  };
  if (map[code]) return map[code];
  if (/unauthorized-domain/.test(code)) return map["auth/unauthorized-domain"];
  if (/permission-denied/.test(code)) return map["permission-denied"];
  if (/network-request-failed/.test(code)) return map["auth/network-request-failed"];
  return "문제가 생겼어요. 잠시 후 다시 시도해 주세요." + (code ? " (" + code + ")" : "");
}

function notesCol(uid) { return collection(fbDb, "users", uid, "notes"); }
function noteRef(uid, id) { return doc(fbDb, "users", uid, "notes", String(id)); }
function todosRef(uid) { return doc(fbDb, "users", uid, "data", "todos"); }
function settingsRef(uid) { return doc(fbDb, "users", uid, "data", "settings"); }

function clean(obj) { return JSON.parse(JSON.stringify(obj)); }

function normalizeNoteId(id) {
  const s = String(id);
  if (/^\d+$/.test(s)) {
    const n = Number(s);
    if (Number.isSafeInteger(n)) return n;
  }
  return s;
}

function normalizeNote(raw) {
  if (!raw) return null;
  const parts = Array.isArray(raw.parts) ? raw.parts.filter(p => p && (p.t === "text" || p.t === "img") && typeof p.v === "string") : [];
  if (!parts.length) return null;
  return {
    id: normalizeNoteId(raw.id),
    time: typeof raw.time === "number" ? raw.time : (Number(raw.time) || Date.now()),
    rot: typeof raw.rot === "number" ? raw.rot : 0,
    parts
  };
}

function notesSignature(list) {
  const rows = (list || []).map(n => [n.id, n.time, n.rot, n.parts]);
  rows.sort((a, b) => String(a[0]).localeCompare(String(b[0])));
  return JSON.stringify(rows);
}

function noteContentKey(n) {
  return JSON.stringify(n.parts || []);
}

function byteSize(obj) {
  try { return new Blob([JSON.stringify(obj)]).size; }
  catch (e) { return JSON.stringify(obj).length; }
}

function recompressDataUrl(src, max, quality) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / (img.width || max));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try { resolve(c.toDataURL("image/jpeg", quality)); }
      catch (e) { resolve(src); }
    };
    img.onerror = () => resolve(src);
    img.src = src;
  });
}

async function shrinkNote(note) {
  let n = { id: note.id, time: note.time, rot: note.rot, parts: note.parts.slice() };
  const steps = [[600, 0.75], [400, 0.62], [300, 0.52], [240, 0.45]];
  for (let i = 0; i < steps.length; i++) {
    if (byteSize(noteToDoc(n)) <= DOC_LIMIT) return n;
    const [max, q] = steps[i];
    const parts = [];
    for (const p of n.parts) {
      if (p.t === "img") parts.push({ t: "img", v: await recompressDataUrl(p.v, max, q) });
      else parts.push(p);
    }
    n = { id: n.id, time: n.time, rot: n.rot, parts };
  }
  return n;
}

function noteToDoc(n) {
  return clean({
    id: String(n.id),
    time: n.time,
    rot: n.rot,
    parts: n.parts,
    updatedAt: new Date().toISOString()
  });
}

function todosPayload(state) {
  const s = state || { v: 1, view: "today", oneoffs: [], routines: [], stickers: [] };
  return clean({
    v: s.v || 1,
    view: s.view === "week" ? "week" : "today",
    oneoffs: Array.isArray(s.oneoffs) ? s.oneoffs : [],
    routines: Array.isArray(s.routines) ? s.routines : [],
    stickers: Array.isArray(s.stickers) ? s.stickers : [],
    updatedAt: new Date().toISOString()
  });
}

function todosSignature(state) {
  const s = todosPayload(state);
  delete s.updatedAt;
  return JSON.stringify(s);
}

function localNotes() {
  if (window.RecordsMemo && typeof window.RecordsMemo.getNotes === "function") {
    return (window.RecordsMemo.getNotes() || []).map(normalizeNote).filter(Boolean);
  }
  try { return (JSON.parse(localStorage.getItem("records-notes") || "[]") || []).map(normalizeNote).filter(Boolean); }
  catch (e) { return []; }
}

function localTodos() {
  if (window.RecordsTodo && typeof window.RecordsTodo.getState === "function") {
    return window.RecordsTodo.getState();
  }
  try { return JSON.parse(localStorage.getItem("records-todos") || "null") || emptyTodos(); }
  catch (e) { return emptyTodos(); }
}

function emptyTodos() { return { v: 1, view: "today", oneoffs: [], routines: [], stickers: [] }; }

function todosHasData(s) {
  if (!s) return false;
  return (s.oneoffs && s.oneoffs.length) || (s.routines && s.routines.length) || (s.stickers && s.stickers.length);
}

function notesFromSnapshot(snap) {
  return snap.docs.map(d => normalizeNote(Object.assign({}, d.data() || {}, { id: d.id })))
    .filter(Boolean)
    .sort((a, b) => (b.time || 0) - (a.time || 0));
}

function applyNotes(list) {
  applyingCloud = true;
  lastNotesJson = notesSignature(list);
  if (window.RecordsMemo) window.RecordsMemo.applyCloud(list);
  applyingCloud = false;
}

function applyTodos(state) {
  applyingCloud = true;
  lastTodosJson = todosSignature(state);
  if (window.RecordsTodo) window.RecordsTodo.applyCloud(state);
  applyingCloud = false;
}

function mergeNotes(cloud, local) {
  const out = [];
  const byId = new Map();
  const content = new Set();
  (cloud || []).forEach(n => {
    const nn = normalizeNote(n);
    if (!nn) return;
    byId.set(String(nn.id), nn);
    content.add(noteContentKey(nn));
    out.push(nn);
  });
  (local || []).forEach(n => {
    const nn = normalizeNote(n);
    if (!nn) return;
    if (byId.has(String(nn.id))) return;
    if (content.has(noteContentKey(nn))) return;
    byId.set(String(nn.id), nn);
    content.add(noteContentKey(nn));
    out.push(nn);
  });
  out.sort((a, b) => (b.time || 0) - (a.time || 0));
  return out;
}

function mergeDone(a, b) {
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach(k => { if (b[k]) out[k] = true; else if (!(k in out)) out[k] = b[k]; });
  return out;
}

function mergeTodos(cloud, local) {
  const c = cloud || emptyTodos();
  const l = local || emptyTodos();
  const oneoffs = [];
  const oneoffIds = new Set();
  const oneoffKey = t => (t.date || "") + "\0" + (t.text || "");
  const oneoffKeys = new Set();
  const takeOne = t => {
    if (!t || !t.id) return;
    if (oneoffIds.has(t.id)) return;
    const k = oneoffKey(t);
    if (oneoffKeys.has(k)) return;
    oneoffIds.add(t.id);
    oneoffKeys.add(k);
    oneoffs.push(t);
  };
  // same id: prefer done, keep local text if present
  const byId = new Map();
  (c.oneoffs || []).forEach(t => byId.set(t.id, Object.assign({}, t)));
  (l.oneoffs || []).forEach(t => {
    if (byId.has(t.id)) {
      const prev = byId.get(t.id);
      byId.set(t.id, Object.assign({}, prev, t, { done: !!(prev.done || t.done) }));
    } else {
      byId.set(t.id, Object.assign({}, t));
    }
  });
  byId.forEach(t => takeOne(t));

  const routines = [];
  const routineIds = new Set();
  const routineKey = r => (r.start || "") + "\0" + (r.text || "");
  const routineKeys = new Set();
  const rById = new Map();
  (c.routines || []).forEach(r => rById.set(r.id, Object.assign({}, r, { done: Object.assign({}, r.done || {}), hidden: (r.hidden || []).slice(), ordDay: Object.assign({}, r.ordDay || {}) })));
  (l.routines || []).forEach(r => {
    if (rById.has(r.id)) {
      const prev = rById.get(r.id);
      rById.set(r.id, Object.assign({}, prev, r, {
        done: mergeDone(prev.done, r.done),
        hidden: Array.from(new Set([].concat(prev.hidden || [], r.hidden || []))),
        ordDay: Object.assign({}, prev.ordDay || {}, r.ordDay || {})
      }));
    } else {
      rById.set(r.id, Object.assign({}, r, { done: Object.assign({}, r.done || {}), hidden: (r.hidden || []).slice(), ordDay: Object.assign({}, r.ordDay || {}) }));
    }
  });
  rById.forEach(r => {
    if (routineIds.has(r.id) || routineKeys.has(routineKey(r))) return;
    routineIds.add(r.id);
    routineKeys.add(routineKey(r));
    routines.push(r);
  });

  const stickerSet = new Set([].concat(c.stickers || [], l.stickers || []).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s)));
  return {
    v: Math.max(c.v || 1, l.v || 1),
    view: l.view || c.view || "today",
    oneoffs,
    routines,
    stickers: Array.from(stickerSet).sort()
  };
}

async function uploadNotes(uid, list) {
  const skipped = [];
  let i = 0;
  const prepared = [];
  for (const raw of list) {
    let n = normalizeNote(raw);
    if (!n) continue;
    n = await shrinkNote(n);
    const data = noteToDoc(n);
    if (byteSize(data) > DOC_LIMIT) {
      skipped.push(n);
      continue;
    }
    prepared.push({ n, data });
  }
  while (i < prepared.length) {
    const batch = writeBatch(fbDb);
    prepared.slice(i, i + 400).forEach(({ n, data }) => {
      batch.set(noteRef(uid, n.id), data, { merge: true });
    });
    await batch.commit();
    i += 400;
  }
  if (skipped.length) {
    toast("이미지가 너무 큰 메모 " + skipped.length + "개는 계정에 올리지 못했어요. 이 브라우저에는 그대로 남아 있어요.");
  }
  return prepared.map(p => p.n);
}

async function deleteMissingNotes(uid, keepList, existingIds) {
  const keep = new Set((keepList || []).map(n => String(n.id)));
  const toDelete = (existingIds || []).filter(id => !keep.has(String(id)));
  let i = 0;
  while (i < toDelete.length) {
    const batch = writeBatch(fbDb);
    toDelete.slice(i, i + 400).forEach(id => batch.delete(noteRef(uid, id)));
    await batch.commit();
    i += 400;
  }
}

async function uploadTodos(uid, state) {
  const data = todosPayload(state);
  if (byteSize(data) > DOC_LIMIT) {
    toast("할 일 데이터가 너무 커서 계정에 올리지 못했어요.");
    return;
  }
  await setDoc(todosRef(uid), data, { merge: true });
}

async function markInitialized(uid) {
  await setDoc(settingsRef(uid), {
    initialized: true,
    updatedAt: new Date().toISOString()
  }, { merge: true });
}

function emptyMoney() { return { v: 1, openingBalance: null, openingMonth: null, entries: [] }; }
function emptyDaily() {

  ], days: {} };
}

function moneyPayload(state) {
  const s = state || emptyMoney();
  return clean({
    v: s.v || 1,
    openingBalance: Number.isFinite(Number(s.openingBalance)) ? Number(s.openingBalance) : null,
    openingMonth: s.openingMonth || null,
    entries: Array.isArray(s.entries) ? s.entries : [],
    updatedAt: new Date().toISOString()
  });
}
function moneySignature(state) {
  const s = moneyPayload(state);
  delete s.updatedAt;
  return JSON.stringify(s);
}
function dailyMetaPayload(state) {
  const s = state || emptyDaily();
  const days = {};
  Object.keys(s.days || {}).forEach(iso => {
    const d = s.days[iso] || {};
    days[iso] = {
      line: d.line || "",
      mood: d.mood || 0,
      thanks: d.thanks || "",
      habits: d.habits || {},
      hasPhoto: !!(d.photo),
      metBf: !!d.metBf
    };
  });
  return clean({
    v: s.v || 1,
    habits: Array.isArray(s.habits) ? s.habits : [],
    days,
    updatedAt: new Date().toISOString()
  });
}
function dailySignature(state) {
  const s = dailyMetaPayload(state);
  delete s.updatedAt;
  return JSON.stringify(s);
}
function ddayPayload(state) {
  const s = state || emptyDday();
  return clean({
    v: s.v || 1,
    items: Array.isArray(s.items) ? s.items : [],
    updatedAt: new Date().toISOString()
  });
}
function ddaySignature(state) {
  const s = ddayPayload(state);
  delete s.updatedAt;
  return JSON.stringify(s);
}

function moneyHasData(s) {
  return !!(s && ((s.entries && s.entries.length) || (s.openingMonth && s.openingBalance != null)));
}
function dailyHasData(s) {
  if (!s) return false;
  if (s.days && Object.keys(s.days).length) return true;
  const defs = ["큐티/묵상", "스트레칭", "기도"].join("|");
  const names = (s.habits || []).map(h => h && h.name).join("|");
  return !!(s.habits && s.habits.length && names !== defs && (s.habits.length !== 3));
}

function photosFromSnapshot(snap) {
  const map = {};
  (snap.docs || []).forEach(d => {

}
function photoSignature(map) {

function mergeMoney(cloud, local) {
  const c = (window.RecordsMoney && window.RecordsMoney.hydrate) ? window.RecordsMoney.hydrate(cloud) : (cloud || emptyMoney());
  const l = (window.RecordsMoney && window.RecordsMoney.hydrate) ? window.RecordsMoney.hydrate(local) : (local || emptyMoney());
  const byId = new Map();
  const keys = new Set();
  const keyOf = e => (e.date || "") + "\0" + (e.type || "") + "\0" + (e.name || "") + "\0" + String(e.amount);
  function take(e) {
    if (!e || !e.id) return;
    if (byId.has(e.id) || keys.has(keyOf(e))) return;
    byId.set(e.id, e);
    keys.add(keyOf(e));
  }
  (c.entries || []).forEach(take);
  (l.entries || []).forEach(take);
  let openingBalance = null, openingMonth = null;
  if (l.openingMonth && l.openingBalance != null) {
    openingMonth = l.openingMonth; openingBalance = l.openingBalance;
  } else if (c.openingMonth && c.openingBalance != null) {
    openingMonth = c.openingMonth; openingBalance = c.openingBalance;
  }
  return { v: Math.max(c.v || 1, l.v || 1), openingBalance, openingMonth, entries: Array.from(byId.values()) };
}

function mergeDaily(cloud, local) {
  const hyd = window.RecordsDaily && window.RecordsDaily.hydrate;
  const c = hyd ? hyd(cloud) : (cloud || emptyDaily());
  const l = hyd ? hyd(local) : (local || emptyDaily());
  const habits = [];
  const ids = new Set();
  const names = new Set();
  function takeH(h) {
    if (!h || !h.id || !h.name) return;
    if (ids.has(h.id) || names.has(h.name)) return;
    ids.add(h.id); names.add(h.name);
    habits.push({ id: String(h.id), name: String(h.name) });
  }
  (c.habits || []).forEach(takeH);
  (l.habits || []).forEach(takeH);
  if (!habits.length) {
    emptyDaily().habits.forEach(takeH);
  }
  const days = {};
  const isos = new Set([].concat(Object.keys(c.days || {}), Object.keys(l.days || {})));
  isos.forEach(iso => {
    const a = (c.days || {})[iso] || {};
    const b = (l.days || {})[iso] || {};
    const hm = Object.assign({}, a.habits || {});
    Object.keys(b.habits || {}).forEach(k => { if (b.habits[k]) hm[k] = true; else if (!(k in hm)) hm[k] = b.habits[k]; });
    days[iso] = {
      line: (b.line && b.line.trim()) ? b.line : (a.line || ""),
      mood: b.mood || a.mood || 0,
      thanks: (b.thanks && b.thanks.trim()) ? b.thanks : (a.thanks || ""),
      habits: hm,
      photo: b.photo || a.photo || null,
      metBf: !!(b.metBf || a.metBf)
    };
  });
  return { v: Math.max(c.v || 1, l.v || 1), habits, days };
}

function mergeDday(cloud, local) {
  const hyd = window.RecordsDday && window.RecordsDday.hydrate;
  const c = hyd ? hyd(cloud) : (cloud || emptyDday());
  const l = hyd ? hyd(local) : (local || emptyDday());
  const byId = new Map();
  const keys = new Set();
  const keyOf = it => (it.title || "") + "\0" + (it.date || "");
  (c.items || []).forEach(it => { if (it && it.id) { byId.set(it.id, Object.assign({}, it)); keys.add(keyOf(it)); } });
  (l.items || []).forEach(it => {
    if (!it || !it.id) return;
    if (byId.has(it.id)) {
      byId.set(it.id, Object.assign({}, byId.get(it.id), it));
    } else if (!keys.has(keyOf(it))) {
      byId.set(it.id, Object.assign({}, it));
      keys.add(keyOf(it));
    }
  });
  return { v: Math.max(c.v || 1, l.v || 1), items: Array.from(byId.values()) };
}

async function shrinkPhoto(src) {
  let out = src;
  const steps = [[800, 0.8], [600, 0.72], [400, 0.6], [300, 0.5], [240, 0.42]];
  for (let i = 0; i < steps.length; i++) {
    const data = clean({ date: "x", photo: out });
    if (byteSize(data) <= DOC_LIMIT) return out;
    out = await recompressDataUrl(out, steps[i][0], steps[i][1]);
  }
  return out;
}

async function uploadPhoto(uid, date, photo) {

  const src = await shrinkPhoto(photo);

async function uploadDailyPhotos(uid, state, existingIds) {
  const days = (state && state.days) || {};
  const keep = new Set();
  for (const iso of Object.keys(days)) {
    if (days[iso] && days[iso].photo) {
      const ok = await uploadPhoto(uid, iso, days[iso].photo);
      if (ok) keep.add(iso);
    }
  }
  const toDelete = (existingIds || []).filter(id => !keep.has(id));
  for (const id of toDelete) {
    try { await deleteDoc(dailyDayRef(uid, id)); } catch (e) {}
  }
}

async function maybeMigrate(uid, bag) {
  bag = bag || {};
  const cloudNotes = bag.cloudNotes || [];
  const cloudTodos = bag.cloudTodos || emptyTodos();
  const cloudNoteIds = bag.cloudNoteIds || [];
  const cloudMoney = bag.cloudMoney || emptyMoney();
  const cloudDaily = bag.cloudDaily || emptyDaily();
  const cloudDday = bag.cloudDday || emptyDday();
  const cloudPhotos = bag.cloudPhotos || {};
  const cloudPhotoIds = bag.cloudPhotoIds || [];

  const locN = localNotes();
  const locT = localTodos();
  const locM = localMoney();
  const locD = localDaily();
  const locDd = localDday();
  const localHas = locN.length > 0 || todosHasData(locT) || moneyHasData(locM) || dailyHasData(locD) || ddayHasData(locDd);
  const cloudHas = (cloudNotes || []).length > 0 || todosHasData(cloudTodos) || moneyHasData(cloudMoney) || dailyHasData(cloudDaily) || ddayHasData(cloudDday);
  const notesDiff = notesSignature(locN) !== notesSignature(cloudNotes || []);
  const todosDiff = todosSignature(locT) !== todosSignature(cloudTodos || emptyTodos());
  const moneyDiff = moneySignature(locM) !== moneySignature(cloudMoney);
  const dailyDiff = dailySignature(locD) !== dailySignature(cloudDaily);
  const ddayDiff = ddaySignature(locDd) !== ddaySignature(cloudDday);
  const different = notesDiff || todosDiff || moneyDiff || dailyDiff || ddayDiff;

  if (localHas && (!cloudHas || different)) {
    const skipKey = "records-migrate-skip:" + uid;
    if (!sessionStorage.getItem(skipKey)) {
      const nCount = locN.length;
      const tCount = (locT.oneoffs || []).length + (locT.routines || []).length;
      const mCount = (locM.entries || []).length;
      const dCount = locD.days ? Object.keys(locD.days).length : 0;
      const ddCount = (locDd.items || []).length;
      const parts = [];
      if (nCount) parts.push("메모 " + nCount + "개");
      if (tCount) parts.push("할 일 " + tCount + "개");
      if (dCount) parts.push("매일 기록 " + dCount + "일");
      if (mCount) parts.push("수입·지출 " + mCount + "개");
      if (ddCount) parts.push("디데이 " + ddCount + "개");
      const label = parts.length ? parts.join(", ") + "를" : "기록을";
      const msg = "이 브라우저에 저장된 " + label +
        " 구글 계정으로 옮길까요? 이미 계정에 있는 같은 항목은 하나로 합쳐져요.";
      if (window.confirm(msg)) {
        try {
          const mergedNotes = mergeNotes(cloudNotes, locN);
          const mergedTodos = mergeTodos(cloudTodos, locT);
          const mergedMoney = mergeMoney(cloudMoney, locM);
          const mergedDaily = mergeDaily(cloudDaily, locD);
          const mergedDday = mergeDday(cloudDday, locDd);
          const uploaded = await uploadNotes(uid, mergedNotes);
          await deleteMissingNotes(uid, uploaded, cloudNoteIds);
          await uploadTodos(uid, mergedTodos);
          await uploadMoney(uid, mergedMoney);
          await uploadDaily(uid, mergedDaily);
          await uploadDailyPhotos(uid, mergedDaily, cloudPhotoIds);
          await uploadDday(uid, mergedDday);
          applyNotes(uploaded.length ? uploaded : mergedNotes);
          applyTodos(mergedTodos);
          applyMoney(mergedMoney);
          const photoMap = {};
          Object.keys((mergedDaily.days || {})).forEach(iso => {
            if (mergedDaily.days[iso] && mergedDaily.days[iso].photo) photoMap[iso] = mergedDaily.days[iso].photo;
          });
          applyDaily(mergedDaily, photoMap);
          applyDday(mergedDday);
          await markInitialized(uid);
          return true;
        } catch (err) {
          toast(friendlyError(err));
        }
      } else {
        try { sessionStorage.setItem(skipKey, "1"); } catch (e) {}
        toast("이 브라우저의 기록은 그대로 남아 있어요. 로그아웃하면 다시 볼 수 있어요.");
      }
    }
  }
  try { await markInitialized(uid); } catch (e) {}
  return false;
}

function stopCloudSync() {
  if (notesUnsub) { notesUnsub(); notesUnsub = null; }
  if (todosUnsub) { todosUnsub(); todosUnsub = null; }
  if (moneyUnsub) { moneyUnsub(); moneyUnsub = null; }
  if (dailyUnsub) { dailyUnsub(); dailyUnsub = null; }
  if (ddayUnsub) { ddayUnsub(); ddayUnsub = null; }
  if (photosUnsub) { photosUnsub(); photosUnsub = null; }
  if (todosTimer) { clearTimeout(todosTimer); todosTimer = null; }
  if (moneyTimer) { clearTimeout(moneyTimer); moneyTimer = null; }
  if (dailyTimer) { clearTimeout(dailyTimer); dailyTimer = null; }
  if (ddayTimer) { clearTimeout(ddayTimer); ddayTimer = null; }
}

function startCloudSync(uid) {
  stopCloudSync();
  notesUnsub = onSnapshot(notesCol(uid), snap => {
    if (applyingCloud) return;
    const list = notesFromSnapshot(snap);
    const sig = notesSignature(list);
    if (sig === lastNotesJson) return;
    applyNotes(list);
  }, err => toast(friendlyError(err)));

  todosUnsub = onSnapshot(todosRef(uid), snap => {
    if (applyingCloud) return;
    const data = snap.exists() ? snap.data() : emptyTodos();
    const sig = todosSignature(data);
    if (sig === lastTodosJson) return;
    applyTodos(data);
  }, err => toast(friendlyError(err)));

  moneyUnsub = onSnapshot(moneyRef(uid), snap => {
    if (applyingCloud) return;
    const data = snap.exists() ? snap.data() : emptyMoney();
    const sig = moneySignature(data);
    if (sig === lastMoneyJson) return;
    applyMoney(data);
  }, err => toast(friendlyError(err)));

  dailyUnsub = onSnapshot(dailyRef(uid), snap => {
    if (applyingCloud) return;
    const data = snap.exists() ? snap.data() : emptyDaily();
    const sig = dailySignature(data);
    if (sig === lastDailyJson) return;
    applyDaily(data);
  }, err => toast(friendlyError(err)));

  ddayUnsub = onSnapshot(ddayRef(uid), snap => {
    if (applyingCloud) return;
    const data = snap.exists() ? snap.data() : emptyDday();
    const sig = ddaySignature(data);
    if (sig === lastDdayJson) return;
    applyDday(data);
  }, err => toast(friendlyError(err)));

  photosUnsub = onSnapshot(dailyCol(uid), snap => {
    if (applyingCloud) return;
    const map = photosFromSnapshot(snap);
    const sig = photoSignature(map);
    if (sig === lastPhotoJson) return;
    lastPhotoJson = sig;
    Object.keys(map).forEach(iso => {
      if (window.RecordsDaily) window.RecordsDaily.applyCloudPhoto(iso, map[iso]);
    });
  }, err => toast(friendlyError(err)));
}

async function enterSignedIn(user) {
  currentUser = user;
  updateAuthUi();
  if (!fbDb) {
    toast("저장소를 불러오지 못했어요. 이 브라우저에만 잠시 저장해요.");
    return;
  }
  try {
    const [nSnap, tSnap, mSnap, dSnap, ddSnap, pSnap] = await Promise.all([
      getDocs(notesCol(user.uid)),
      getDoc(todosRef(user.uid)),
      getDoc(moneyRef(user.uid)),
      getDoc(dailyRef(user.uid)),
      getDoc(ddayRef(user.uid)),
      getDocs(dailyCol(user.uid))
    ]);
    const cloudNotes = notesFromSnapshot(nSnap);
    const cloudTodos = tSnap.exists() ? tSnap.data() : emptyTodos();
    const cloudMoney = mSnap.exists() ? mSnap.data() : emptyMoney();
    const cloudDaily = dSnap.exists() ? dSnap.data() : emptyDaily();
    const cloudDday = ddSnap.exists() ? ddSnap.data() : emptyDday();
    const cloudPhotos = photosFromSnapshot(pSnap);
    const wrote = await maybeMigrate(user.uid, {
      cloudNotes, cloudTodos, cloudNoteIds: nSnap.docs.map(d => d.id),
      cloudMoney, cloudDaily, cloudDday, cloudPhotos, cloudPhotoIds: pSnap.docs.map(d => d.id)
    });
    if (!wrote) {
      applyNotes(cloudNotes);
      applyTodos(cloudTodos);
      applyMoney(cloudMoney);
      applyDaily(cloudDaily, cloudPhotos);
      applyDday(cloudDday);
    }
    startCloudSync(user.uid);
  } catch (err) {
    toast(friendlyError(err));
    startCloudSync(user.uid);
  }
}

async function loginGoogle() {
  if (!fbReady || !fbAuth) {
    toast("로그인 기능을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.");
    return;
  }
  const provider = googleProvider();
  try {
    if (isMobileAuth()) {
      await signInWithRedirect(fbAuth, provider);
      return;
    }
    await signInWithPopup(fbAuth, provider);
  } catch (err) {
    if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) {
      try {
        toast("팝업이 차단되어 다른 방법으로 로그인할게요.");
        await signInWithRedirect(fbAuth, provider);
      } catch (err2) {
        toast(friendlyError(err2));
      }
    } else if (err && (err.code === "auth/popup-closed-by-user" || err.code === "auth/cancelled-popup-request")) {
      return;
    } else {
      toast(friendlyError(err));
    }
  }
}

async function logoutGoogle() {
  try {
    if (todosTimer) { clearTimeout(todosTimer); todosTimer = null; }
    if (moneyTimer) { clearTimeout(moneyTimer); moneyTimer = null; }
    if (dailyTimer) { clearTimeout(dailyTimer); dailyTimer = null; }
    if (ddayTimer) { clearTimeout(ddayTimer); ddayTimer = null; }
    if (currentUser && fbDb) {
      try { await pushTodosNow(localTodos()); } catch (e) {}
      try { await pushMoneyNow(localMoney()); } catch (e) {}
      try { await pushDailyNow(localDaily()); } catch (e) {}
      try { await pushDdayNow(localDday()); } catch (e) {}
    }
    stopCloudSync();
    if (fbAuth) await signOut(fbAuth);
  } catch (err) {
    toast(friendlyError(err));
  }
}

window.RecordsCloud = {
  get ready() { return fbReady; },
  isLoggedIn() { return !!currentUser; },
  onNotesSave(notes) {
    if (!currentUser || applyingCloud) return;
    pushNotesNow(notes);
  },
  onTodosSave(state) {
    if (!currentUser || applyingCloud) return;
    clearTimeout(todosTimer);
    todosTimer = setTimeout(() => { todosTimer = null; pushTodosNow(state); }, 250);
  },
  onMoneySave(state) {
    if (!currentUser || applyingCloud) return;
    clearTimeout(moneyTimer);
    moneyTimer = setTimeout(() => { moneyTimer = null; pushMoneyNow(state); }, 250);
  },
  onDailySave(state) {
    if (!currentUser || applyingCloud) return;
    clearTimeout(dailyTimer);
    dailyTimer = setTimeout(() => { dailyTimer = null; pushDailyNow(state); }, 250);
  },
  onDailyPhotoSave(date, photo) {
    if (!currentUser || applyingCloud) return;
    pushPhotoNow(date, photo);
  },
  onDdaySave(state) {
    if (!currentUser || applyingCloud) return;
    clearTimeout(ddayTimer);
    ddayTimer = setTimeout(() => { ddayTimer = null; pushDdayNow(state); }, 250);
  }
};

const loginBtn = $("btn-login");
const logoutBtn = $("btn-logout");
if (loginBtn) loginBtn.addEventListener("click", () => { loginGoogle(); });
if (logoutBtn) logoutBtn.addEventListener("click", () => { logoutGoogle(); });

(async function startAuth() {
  updateAuthUi();
  if (!fbReady || !fbAuth) return;
  try {
    await getRedirectResult(fbAuth);
  } catch (err) {
    toast(friendlyError(err));
  }
  onAuthStateChanged(fbAuth, user => {
    if (user) enterSignedIn(user);
    else enterSignedOut();
  });
})();

</script>
